<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="description" content="Propuesta de WeCode: programación y robótica para colegios.">
<link rel="icon" href="img/st/code.svg" type="image/svg+xml">
<title>Propuesta WeCode</title>
<style>
/* Layout: página de una sola columna con bandas de color a todo el ancho (azul, blanco, celeste pálido) y contenido centrado a 1120px.
   Identidad de WeCode fija: no cambia con el tema del visitante. */
@font-face { font-family: "Poppins"; src: url("fonts/Poppins-Regular.ttf") format("truetype"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Poppins"; src: url("fonts/Poppins-SemiBold.ttf") format("truetype"); font-weight: 500 600; font-display: swap; }
@font-face { font-family: "Poppins"; src: url("fonts/Poppins-Bold.ttf") format("truetype"); font-weight: 700; font-display: swap; }
@font-face { font-family: "Poppins"; src: url("fonts/Poppins-ExtraBold.ttf") format("truetype"); font-weight: 800 900; font-display: swap; }
:root {
  --blue: #3462ac;
  --blue-deep: #2b5596;
  --navy: #1a3d66;
  --yellow: #fdca40;
  --orange: #ff9d1c;
  --sky: #7cc9df;
  --pale: #e8f8fd;
  --paper: #ffffff;
  --text: #34465c;
  --muted: #7d8a9c;
  --chip-off: #eef2f7;
  --line: #dbe5ef;
  --f: "Poppins", "Segoe UI", system-ui, sans-serif;
  --wrap: 1120px;
  --gut: max(20px, env(safe-area-inset-left, 0px));
  --gut-r: max(20px, env(safe-area-inset-right, 0px));
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--paper); color: var(--text); font-family: var(--f); font-size: 17px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
img { max-width: 100%; }
a { color: inherit; }
.wrap { max-width: var(--wrap); margin: 0 auto; padding-left: var(--gut); padding-right: var(--gut-r); }
.band { padding-block: 88px; position: relative; overflow: hidden; }
.band.blue { background: var(--blue); color: #fff; }
.band.pale { background: var(--pale); }
.eyebrow { font-size: 14px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--orange); margin: 0 0 10px; }
.blue .eyebrow { color: var(--yellow); }
h2 { font-size: clamp(30px, 4.4vw, 46px); line-height: 1.08; font-weight: 800; color: var(--navy); margin: 0; letter-spacing: -.012em; text-wrap: balance; }
.blue h2 { color: #fff; }
.lead { font-size: 19px; max-width: 62ch; margin: 16px 0 0; }
.pill { display: inline-block; border-radius: 999px; padding: 5px 15px; font-weight: 600; font-size: 14px; line-height: 1.4; white-space: nowrap; }
.pill.cur { background: var(--blue); color: #fff; }
.pill.ext { background: var(--yellow); color: var(--navy); }
.pill.navy { background: var(--navy); color: #fff; }
:focus-visible { outline: 3px solid var(--orange); outline-offset: 3px; border-radius: 6px; }

/* Barra superior */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--blue); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: rgba(52, 98, 172, .92); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; height: 64px; }
.top img { height: 30px; width: auto; display: block; }
.top nav { display: flex; gap: 22px; align-items: center; font-size: 15px; color: rgba(255,255,255,.88); }
.top nav a { text-decoration: none; }
.top nav a:hover { color: #fff; }
.top .cta { background: var(--yellow); color: var(--navy); font-weight: 700; padding: 8px 16px; border-radius: 999px; }
@media (max-width: 760px) { .top nav a:not(.cta) { display: none; } }

/* Portada */
.hero { padding-block: 64px 96px; }
.hero .wrap { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); gap: 48px; align-items: center; position: relative; z-index: 1; }
.hero .for { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; font-size: clamp(22px, 2.6vw, 28px); font-weight: 600; color: #fff; margin: 0 0 10px; line-height: 1.2; }
.hero .for img { height: 1.35em; width: auto; display: block; transform: translateY(.06em); }
.hero .for .yr { color: var(--yellow); }
.hero h1 { font-size: clamp(42px, 7vw, 76px); line-height: 1.02; font-weight: 800; margin: 0; color: #fff; letter-spacing: -.02em; text-wrap: balance; overflow-wrap: anywhere; }
.hero .tag { font-size: clamp(21px, 2.6vw, 28px); line-height: 1.25; font-weight: 700; color: var(--yellow); margin: 22px 0 0; text-wrap: balance; }
.hero .meta { margin-top: 26px; font-size: 15px; color: rgba(255,255,255,.75); }
.hero .ph { position: relative; aspect-ratio: 44 / 50; max-width: 100%; border-radius: 36px; border: 10px solid #fff; background: center / cover no-repeat; box-shadow: 0 30px 60px rgba(10, 30, 70, .35); }
.hero .ph .stk { position: absolute; left: -38px; bottom: 34px; width: 96px; }
.hero .scroll { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); font-size: 13px; color: rgba(255,255,255,.7); text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 2px; z-index: 1; }
.doodle { position: absolute; pointer-events: none; z-index: 0; }
@media (max-width: 860px) {
  .hero .wrap { grid-template-columns: minmax(0, 1fr); }
  .hero .ph { max-width: 420px; }
  .hero .ph .stk { left: auto; right: -14px; bottom: -20px; width: 80px; }
  .hero .doodle.hide-sm, .hero .scroll { display: none; }
}

/* Vistazo */
.glance .head { display: flex; flex-direction: column; gap: 4px; }
.track { display: flex; flex-wrap: wrap; gap: 26px 34px; margin-top: 40px; }
.grp-name { font-size: 13px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { width: 70px; height: 68px; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--chip-off); color: #a9b4c2; line-height: 1.1; border: 0; font: inherit; padding: 0; position: relative; }
.chip b { font-size: 23px; font-weight: 800; }
.chip span { font-size: 12px; font-weight: 500; }
.chip.cur { background: var(--blue); color: #fff; }
.chip.ext { background: var(--yellow); color: var(--navy); }
button.chip { cursor: pointer; transition: transform .18s, box-shadow .18s; }
button.chip:hover { transform: translateY(-4px); box-shadow: 0 10px 20px rgba(26, 61, 102, .18); }
.chip .tip { position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%); background: var(--navy); color: #fff; font-size: 12px; font-weight: 500; padding: 5px 9px; border-radius: 8px; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .15s; }
button.chip:hover .tip, button.chip:focus-visible .tip { opacity: 1; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 22px; margin-top: 18px; font-size: 14px; }
.legend i { display: inline-block; width: 13px; height: 13px; border-radius: 4px; vertical-align: -1px; margin-right: 6px; }
.prices { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 22px; margin-top: 40px; }
.pcard { border-radius: 28px; padding: 30px 32px; display: flex; flex-wrap: wrap; gap: 18px 30px; align-items: center; }
.pcard.cur { background: var(--blue); color: #fff; }
.pcard.ext { background: var(--yellow); color: var(--navy); }
.pcard .mod { display: block; font-size: 14px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; opacity: .85; }
.pcard .num { display: block; font-size: clamp(50px, 6vw, 66px); font-weight: 800; line-height: 1.05; letter-spacing: -.02em; font-variant-numeric: tabular-nums; margin-top: 4px; }
.pcard .unit { font-size: 15px; opacity: .85; }
.pcard ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; font-size: 15.5px; line-height: 1.4; flex: 1 1 220px; min-width: 0; }
.pcard li { padding-left: 22px; position: relative; }
.pcard li::before { content: ""; position: absolute; left: 0; top: 7px; width: 10px; height: 10px; border-radius: 50%; background: currentColor; opacity: .5; }
.glance .note { margin-top: 22px; font-size: 14px; color: var(--muted); }

/* Logos */
.trust { padding-block: 56px; background: #355d9c; }
.trust .lbl { font-weight: 800; font-size: 24px; color: #fff; margin: 0 0 22px; }
.marquee { overflow: hidden; -webkit-mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent); mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent); }
.marquee-track { display: flex; width: max-content; animation: scrollx 38s linear infinite; }
.marquee:hover .marquee-track { animation-play-state: paused; }
.marquee-set { display: flex; align-items: center; gap: 18px; padding-right: 18px; }
.logos-rows { display: flex; flex-direction: column; gap: 12px; }
.logos-row .marquee-set { gap: 12px; padding-right: 12px; }
.logos-row.r1 .marquee-track { animation-duration: 70s; }
.logos-row.r2 .marquee-track { animation-duration: 80s; animation-direction: reverse; }
.lg { width: 96px; height: 96px; flex: 0 0 auto; background: #fff; border: 1px solid #e5e5e5; border-radius: 8px; padding: 4px; }
.lg > div { width: 100%; height: 100%; border: 1px solid #131313; border-radius: 4px; display: flex; align-items: center; justify-content: center; padding: 12px; background: #fff; }
.lg img { max-width: 100%; max-height: 100%; width: auto; height: auto; display: block; }
.trust .count { font-weight: 500; font-size: 16px; color: rgba(255,255,255,.7); margin-left: 10px; }
@media (max-width: 600px) { .lg { width: 80px; height: 80px; } .lg > div { padding: 9px; } }
/* Galería */
.gallery { margin-top: 40px; overflow: hidden; }
.gallery .marquee-track { animation-duration: 60s; animation-direction: reverse; }
.gallery .marquee-set { gap: 16px; padding-right: 16px; }
.gallery img { height: 240px; width: auto; aspect-ratio: 3 / 2; object-fit: cover; border-radius: 22px; display: block; }
.gallery .marquee-set img:nth-child(odd) { transform: rotate(-1.5deg); }
.gallery .marquee-set img:nth-child(even) { transform: rotate(1.5deg); margin-top: 18px; }
@media (max-width: 600px) { .gallery img { height: 170px; } }
@keyframes scrollx { to { transform: translateX(-50%); } }

/* Quiénes somos */
.about .wrap { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, .85fr); gap: 56px; align-items: center; }
.about ul { list-style: none; padding: 0; margin: 28px 0 0; display: flex; flex-direction: column; gap: 18px; }
.about li { display: flex; gap: 16px; align-items: center; font-size: 18px; line-height: 1.4; color: var(--navy); }
.about li img { width: 40px; height: 40px; flex: 0 0 auto; }
.about .ph { aspect-ratio: 44 / 42; max-width: 100%; border-radius: 30px; background: center / cover no-repeat; position: relative; }
.about .ph img { position: absolute; left: -30px; bottom: -24px; width: 92px; }
@media (max-width: 860px) { .about .wrap { grid-template-columns: minmax(0, 1fr); } .about .ph img { left: auto; right: -10px; } }

/* Programas */
.progs { display: flex; flex-direction: column; gap: 64px; margin-top: 28px; }
.level-block { margin-top: 64px; }
.level-title { display: inline-block; margin: 0; font-size: 15px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #fff; background: var(--navy); padding: 6px 16px; border-radius: 999px; }
/* Jardín: celeste cuadriculado con bloques */
.kinder { position: relative; overflow: hidden; margin-top: 44px; border-radius: 32px; padding: 48px 48px 44px; scroll-margin-top: 90px;
  background-color: #dff3fa; background-image: linear-gradient(rgba(255,255,255,.8) 1.5px, transparent 1.5px), linear-gradient(90deg, rgba(255,255,255,.8) 1.5px, transparent 1.5px); background-size: 30px 30px; }
.kinder .kd { position: absolute; pointer-events: none; }
.kinder .stack-img { right: 40px; top: 34px; width: 220px; }
.kinder .plus { font-size: 38px; font-weight: 800; color: var(--orange); line-height: 1; }
.kinder .plus.sky { color: var(--sky); }
.kinder-txt { position: relative; max-width: 600px; }
.kinder h3 { font-size: clamp(40px, 6vw, 64px); line-height: 1.02; font-weight: 800; color: var(--navy); margin: 0 0 14px; }
.kinder .tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.kinder-txt p:not(.eyebrow) { color: var(--navy); margin: 0; }
.acts-title { position: relative; font-size: 22px; font-weight: 800; color: var(--blue); margin: 34px 0 14px; }
.acts { position: relative; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 18px; }
.act { background: #fff; border: 1px solid #e5e5e5; border-radius: 14px; padding: 6px; box-shadow: 0 4px 0 rgba(19,19,19,.08); transform: rotate(var(--r, 0deg)); transition: transform .2s; }
.act:hover { transform: rotate(0deg) translateY(-6px) scale(1.03); }
.act .aimg { aspect-ratio: 1; border-radius: 9px; border: 1px solid #131313; background: center / cover no-repeat; }
.act span { display: block; text-align: center; font-size: 14px; font-weight: 700; line-height: 1.25; color: var(--navy); padding: 10px 4px 6px; }
@media (max-width: 960px) { .acts { grid-template-columns: repeat(3, minmax(0, 1fr)); } .kinder .stack-img { width: 150px; opacity: .9; } }
@media (max-width: 600px) { .kinder { padding: 32px 20px; } .acts { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; } .kinder .stack-img { width: 78px; right: 14px; top: 14px; } .kinder-txt { padding-top: 64px; } .kinder .hide-sm, .kinder .kd.float, .kinder .plus { display: none; } }
.prog { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 48px; align-items: center; scroll-margin-top: 90px; }
.prog:nth-child(even) .pimg { order: 2; }
.prog .pimg { aspect-ratio: 16 / 10; max-width: 100%; border-radius: 28px; background: #f3f5f8 center / cover no-repeat; transition: transform .35s; }
.prog:hover .pimg { transform: rotate(-1.2deg) scale(1.015); }
.prog .tags { display: flex; flex-wrap: wrap; gap: 8px; }
.prog h3 { font-size: clamp(26px, 3vw, 34px); line-height: 1.12; font-weight: 800; color: var(--navy); margin: 14px 0 10px; }
.prog p { margin: 0 0 10px; font-size: 17px; }
.prog.flash .pimg { animation: flash 1.2s ease; }
@keyframes flash { 30% { box-shadow: 0 0 0 8px var(--yellow); } }
@media (max-width: 860px) { .prog { grid-template-columns: minmax(0, 1fr); gap: 20px; } .prog:nth-child(even) .pimg { order: 0; } }

/* Qué incluye */
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; margin-top: 40px; position: relative; z-index: 1; }
.tile { background: #fff; color: var(--text); border-radius: 24px; padding: 26px 26px 28px; display: flex; flex-direction: column; gap: 8px; transition: transform .2s; }
.tile:hover { transform: translateY(-6px); }
.tile:hover img { animation: wobble .6s ease; }
.tile img { width: 60px; height: 60px; }
.tile b { font-size: 20px; line-height: 1.2; font-weight: 700; color: var(--navy); margin-top: 6px; }
.tile span { font-size: 15.5px; line-height: 1.45; }
@media (max-width: 860px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .tiles { grid-template-columns: minmax(0, 1fr); } }
@keyframes wobble { 25% { transform: rotate(-10deg) scale(1.08); } 60% { transform: rotate(8deg); } }

/* Condiciones y anexo */
.acc { display: grid; gap: 14px; margin-top: 36px; }
details.box { border-radius: 20px; background: #f4f7fb; padding: 0; }
details.box.cur { background: #eaf0f9; }
details.box.ext { background: #fff6dc; }
details.box summary { list-style: none; cursor: pointer; padding: 20px 24px; display: flex; align-items: center; gap: 12px; font-size: 19px; font-weight: 700; color: var(--navy); }
details.box summary::-webkit-details-marker { display: none; }
details.box summary::after { content: "+"; margin-left: auto; font-size: 26px; font-weight: 600; line-height: 1; color: var(--orange); transition: transform .2s; }
details.box[open] summary::after { transform: rotate(45deg); }
.dot { width: 12px; height: 12px; border-radius: 50%; flex: 0 0 auto; }
.dot.cur { background: var(--blue); } .dot.ext { background: var(--yellow); box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); }
details.box .in { padding: 0 24px 22px; }
details.box ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; font-size: 15.5px; }
details.box li::marker { color: var(--orange); }
.tbl { overflow-x: auto; margin: 6px 0 14px; }
.tbl table { border-collapse: collapse; min-width: 760px; width: 100%; font-size: 14.5px; line-height: 1.45; }
.tbl th { background: var(--navy); color: #fff; font-weight: 500; text-align: left; padding: 10px 12px; }
.tbl td { border-bottom: 1px solid var(--line); padding: 12px; vertical-align: top; background: #fff; }
.tbl td:first-child { font-weight: 700; color: var(--navy); white-space: nowrap; }
.tbl strong { color: var(--navy); }
.small { font-size: 15px; }

/* Cierre */
.close .wrap { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); gap: 48px; align-items: center; position: relative; z-index: 1; }
.close h2 { color: var(--yellow); font-size: clamp(38px, 6vw, 64px); }
.close .lead { color: rgba(255,255,255,.92); }
.contact { margin-top: 30px; background: #fff; color: var(--navy); border-radius: 24px; padding: 22px 26px; display: flex; flex-direction: column; gap: 2px; max-width: 460px; }
.contact b { font-size: 21px; font-weight: 800; }
.contact .role { color: var(--text); font-size: 15px; }
.contact .lines { margin-top: 10px; display: flex; flex-direction: column; gap: 4px; font-size: 16px; user-select: all; }
.btns { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
.btn { font: inherit; font-size: 15px; font-weight: 700; border: 0; border-radius: 999px; padding: 11px 18px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; }
.btn.y { background: var(--yellow); color: var(--navy); }
.btn.o { background: transparent; color: var(--navy); box-shadow: inset 0 0 0 2px var(--navy); }
.close .ph { aspect-ratio: 43 / 44; max-width: 100%; border-radius: 36px; border: 10px solid #fff; background: center / cover no-repeat; position: relative; }
.close .ph img { position: absolute; left: -36px; bottom: 30px; width: 88px; }
.foot { background: var(--blue-deep); color: #fff; padding-block: 20px calc(20px + env(safe-area-inset-bottom, 0px)); font-size: 15px; }
.foot .wrap { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 48px; }
@media (max-width: 860px) { .close .wrap { grid-template-columns: minmax(0, 1fr); } .close .ph { max-width: 420px; } .close .ph img { left: auto; right: -10px; bottom: -20px; } }

.empty { min-height: 70vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 14px; background: var(--blue); color: #fff; padding: 40px var(--gut-r) 40px var(--gut); }
.empty img { width: 220px; }
.empty h1 { font-size: 30px; margin: 10px 0 0; }
.empty p { margin: 0; max-width: 46ch; color: rgba(255,255,255,.85); }

/* Movimiento */
@media (prefers-reduced-motion: no-preference) {
  .float { animation: float 6s ease-in-out infinite; }
  .float.slow { animation-duration: 9s; }
  .float.rev { animation-direction: reverse; }
  .fly { animation: fly 7s ease-in-out infinite; }
  .spin { animation: spin 14s linear infinite; }
  .pop { animation: pop .55s cubic-bezier(.2, 1.4, .4, 1) both; }
  .rise { animation: rise .8s cubic-bezier(.2, .8, .2, 1) both; }
  .hero .ph .stk, .close .ph img, .about .ph img { animation: bob 3.2s ease-in-out infinite; }
  @supports (animation-timeline: view()) {
    .reveal { animation: reveal linear both; animation-timeline: view(); animation-range: entry 0% cover 28%; }
  }
}
@media (prefers-reduced-motion: reduce) { .marquee-track { animation: none; } html { scroll-behavior: auto; } }
@keyframes float { 0%, 100% { transform: rotate(var(--r, 0deg)); } 50% { transform: translateY(-14px) rotate(var(--r, 0deg)); } }
@keyframes fly { 0%, 100% { transform: translate(0, 0) rotate(0deg); } 50% { transform: translate(-18px, -22px) rotate(-6deg); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes bob { 50% { transform: translateY(-8px) rotate(-4deg); } }
@keyframes pop { from { transform: scale(.6); opacity: 0; } }
@keyframes rise { from { transform: translateY(26px); opacity: 0; } }
@keyframes reveal { from { opacity: .2; transform: translateY(40px); } }
</style>
</head>
<body>


<div id="app">
  <div class="empty" id="loading">
    <img src="img/logo-white.png" alt="WeCode">
    <p>Cargando la propuesta…</p>
  </div>
</div>

<script src="catalog.js?v=7"></script>
<script>
"use strict";
const IMG = "img/";
const bgStyle = f => 'style="background-image:url(\'' + IMG + f + '\')"';

function waLink(phone) {
  const d = String(phone || "").replace(/\D+/g, "").replace(/^0/, "");
  return d.length >= 8 ? "https://wa.me/598" + d : "";
}

function render(st) {
  const M = modelFor(st);
  const school = String(st.school || "tu colegio");
  document.title = "Propuesta WeCode " + st.year + " · " + school;
  const nGr = M.sel.length;
  const chip = (g, i) => {
    const x = st.grades[g.id];
    const row = M.rows.findIndex(r => r.grades.includes(g));
    const inner = "<b>" + chipNum(g) + "</b><span>" + g.chip + "</span>";
    if (!x.on) return '<div class="chip pop" style="animation-delay:' + (i * 45) + 'ms">' + inner + "</div>";
    return '<button type="button" class="chip pop ' + MOD[x.mod].cls + '" style="animation-delay:' + (i * 45) + 'ms" data-row="' + row + '" aria-label="' + esc(gradeName(g) + ": " + programById(x.program).title) + '">' + inner +
      '<span class="tip">' + esc(programById(x.program).title) + "</span></button>";
  };
  let gi = 0;
  const grp = (name, lvl) => '<div><div class="grp-name">' + name + '</div><div class="chips">' + GRADES.filter(g => g.level === lvl).map(g => chip(g, gi++)).join("") + "</div></div>";
  const priceCards = M.mods.map(m => {
    const cur = m === "curricular";
    const price = cur ? st.priceCur : st.priceExt;
    const mins = cur ? st.minCur : st.minExt;
    return '<div class="pcard reveal ' + MOD[m].cls + '"><div><span class="mod">' + MOD[m].label + '</span><span class="num" data-count="' + (Number(price) || 0) + '">' + money(price) + '</span><span class="unit">por alumno, por mes</span></div><ul>' +
      "<li>" + esc(joinY(M.modRows(m).map(r => r.label))) + "</li>" +
      "<li>Una clase semanal de " + (cur ? "" : "hasta ") + esc(mins) + " minutos</li>" +
      "<li>" + (cur ? "Para todos los alumnos, dentro del horario" : "Optativo: cada familia elige si participa") + "</li></ul></div>";
  }).join("");
  const logoHtml = list => list.map(l => '<div class="lg"><div><img src="' + IMG + "logos/" + l.file + '" alt="' + esc(l.name) + '"></div></div>').join("");
  const half = Math.ceil(SCHOOL_LOGOS.length / 2);
  // Cada fila repite su mitad para que la cinta no deje huecos en pantallas anchas
  const logoRow = (list, cls) => { const set = logoHtml(list) + logoHtml(list); return '<div class="marquee logos-row ' + cls + '"><div class="marquee-track"><div class="marquee-set">' + set + '</div><div class="marquee-set" aria-hidden="true">' + set + "</div></div></div>"; };
  const gallery = GALLERY.map(f => '<img src="' + IMG + "gal/" + f + '" alt="Feria de Proyectos de WeCode">').join("");
  const tagsOf = r => '<div class="tags"><span class="pill navy">' + esc(r.label) + '</span><span class="pill ' + MOD[r.mod].cls + '">' + MOD[r.mod].label + "</span></div>";
  const progArticle = (r, i) => '<article class="prog reveal" id="prog-' + i + '"><div class="pimg" ' + bgStyle(r.prog.img + ".jpg") + ' role="img" aria-label="' + esc(r.prog.title) + '"></div><div>' +
    tagsOf(r) + "<h3>" + esc(r.prog.title) + "</h3>" + r.prog.paras.map(p => "<p>" + rich(p) + "</p>").join("") + "</div></article>";
  const kinderBlock = (r, i) => '<article class="kinder reveal" id="prog-' + i + '">' +
      '<img class="kd stack-img" src="' + IMG + 'kinder/stack.svg" alt="">' +
      '<img class="kd float" src="' + IMG + 'kinder/brick-yellow.svg" style="right:290px;top:30px;width:84px;--r:-12deg" alt="">' +
      '<img class="kd hide-sm" src="' + IMG + 'kinder/brick-orange.svg" style="left:-20px;bottom:26px;width:84px;transform:rotate(18deg)" alt="">' +
      '<img class="kd float rev hide-sm" src="' + IMG + 'st/happy.svg" style="right:330px;top:150px;width:70px" alt="">' +
      '<span class="kd plus" style="left:52%;top:28px">+</span><span class="kd plus sky hide-sm" style="right:40px;bottom:30px">+</span>' +
      '<div class="kinder-txt"><p class="eyebrow">Jardín</p><h3>' + esc(r.prog.title) + "</h3>" + tagsOf(r) + r.prog.paras.map(p => "<p>" + rich(p) + "</p>").join("") + "</div>" +
      '<p class="acts-title">¿Qué hacemos?</p><div class="acts">' +
      KINDER_ACTIVITIES.map((a, k) => '<div class="act" style="--r:' + [-2, 1.5, -1, 2, -1.5][k] + 'deg"><div class="aimg" ' + bgStyle(a.img) + '></div><span>' + esc(a.label) + "</span></div>").join("") +
      "</div></article>";
  const indexed = M.rows.map((r, i) => ({ r, i }));
  const levelBlock = (lvl, name) => {
    const list = indexed.filter(x => x.r.band !== "k5" && x.r.grades[0].level === lvl);
    return list.length ? '<div class="level-block"><p class="level-title">' + name + '</p><div class="progs">' + list.map(x => progArticle(x.r, x.i)).join("") + "</div></div>" : "";
  };
  const kinderRow = indexed.find(x => x.r.band === "k5");
  const progs = (kinderRow ? kinderBlock(kinderRow.r, kinderRow.i) : "") + levelBlock("primaria", "Primaria") + levelBlock("secundaria", "Secundaria");
  const tiles = [
    ["calendar", "Clases semanales presenciales", "Con un equipo docente estable de WeCode, en el día y horario que defina el colegio."],
    ["chat", "Coordinación permanente", "Coordinación académica y administrativa en contacto continuo con el colegio."],
  ];
  if (M.certification) tiles.push(["cap", "Certificación internacional", "Preparación para la certificación de STEM.org, incluida para todos los alumnos a partir de 3er grado."]);
  tiles.push(
    ["family", "Clase abierta con familias", "A mitad de año, a convenir con el colegio, para mostrar lo aprendido."],
    ["medal", "Feria de Proyectos", "El gran evento de cierre de año: exposición de trabajos y entrega de medallas."],
    ["box", "Todos los materiales", "Robots, placas electrónicas, accesorios y licencias de programas. Sin costos ocultos."]
  );
  const termCols = termsFor(M, st).map((c, i) => '<details class="box ' + c.cls + '"' + (i === 0 ? " open" : "") + "><summary>" + (c.cls ? '<span class="dot ' + c.cls + '"></span>' : "") + esc(c.title) +
    '</summary><div class="in"><ul>' + c.items.map(t => "<li>" + esc(t) + "</li>").join("") + "</ul></div></details>").join("");
  const annex = annexSections(M).map(s => {
    const c = CONCL(s.key);
    return '<details class="box"><summary>' + esc(s.title) + '</summary><div class="in small">' + s.intro.map(p => "<p>" + rich(p) + "</p>").join("") +
      '<div class="tbl"><table><thead><tr><th>Grado</th><th>Rúbrica / programa oficial</th><th>Propuesta WeCode</th><th>' + s.last + "</th></tr></thead><tbody>" +
      s.bands.map(k => { const a = ALIGN[k]; return "<tr><td>" + a.label + "</td><td>" + esc(a.rubric) + "</td><td>" + esc(a.wecode) + "</td><td>" + rich(a.note) + "</td></tr>"; }).join("") +
      "</tbody></table></div><p><strong>Conclusión.</strong> " + esc(c.text) + "</p><ul>" + c.items.map(t => "<li>" + esc(t) + "</li>").join("") + "</ul></div></details>";
  }).join("");
  const wa = waLink(st.cPhone);

  document.getElementById("app").innerHTML =
    '<header class="top"><div class="wrap"><img src="' + IMG + 'logo-white.png" alt="WeCode"><nav>' +
      '<a href="#vistazo">Resumen</a><a href="#programas">Programas</a><a href="#condiciones">Condiciones</a><a class="cta" href="#contacto">Hablemos</a></nav></div></header>' +

    '<section class="band blue hero">' +
      '<img class="doodle float slow hide-sm" src="' + IMG + 'd-cloud1.png" style="left:6%;top:30px;width:150px" alt="">' +
      '<img class="doodle float rev hide-sm" src="' + IMG + 'd-planet.png" style="left:44%;top:60px;width:96px" alt="">' +
      '<img class="doodle spin" src="' + IMG + 'd-star1.png" style="right:4%;top:40px;width:44px" alt="">' +
      '<img class="doodle" src="' + IMG + 'd-squiggle-b.png" style="left:-10px;bottom:90px;width:300px" alt="">' +
      '<img class="doodle fly hide-sm" src="' + IMG + 'd-plane.png" style="left:40%;bottom:70px;width:110px" alt="">' +
      '<img class="doodle spin" src="' + IMG + 'd-star2.png" style="left:36%;bottom:40px;width:30px" alt="">' +
      '<img class="doodle hide-sm" src="' + IMG + 'd-squiggle-o.png" style="right:-40px;bottom:30px;width:420px" alt="">' +
      '<img class="doodle fly hide-sm" src="' + IMG + 'd-rocket.png" style="right:3%;bottom:70px;width:150px;z-index:2" alt="">' +
      '<div class="wrap"><div class="rise">' +
        '<p class="for"><span>Propuesta <span class="yr">' + esc(st.year) + '</span></span><img src="' + IMG + 'logo-white.png" alt="WeCode"><span>para</span></p><h1>' + esc(school) + "</h1>" +
        '<p class="tag">Pensamiento computacional, programación y robótica.</p>' +
        (longDate(st.date) ? '<p class="meta">' + esc(longDate(st.date)) + "</p>" : "") + "</div>" +
        '<div class="ph rise" style="animation-delay:.15s;background-image:url(\'' + cssUrl(coverPhoto(st)) + '\')"><img class="stk" src="' + IMG + 'st/happy.svg" alt=""></div>' +
      '</div><a class="scroll" href="' + (st.intro !== false ? "#quienes" : "#vistazo") + '">Ver la propuesta<span aria-hidden="true">↓</span></a></section>' +

    (st.intro !== false ? (
    '<section class="band pale about" id="quienes"><div class="wrap"><div class="reveal"><p class="eyebrow">Qué hace WeCode</p><h2>Programación y robótica, dentro de tu colegio</h2><ul>' +
      ["Programas originales para enseñar tecnología a niños y adolescentes.", "Aprendizaje por proyectos, basado en la experimentación y la creación.",
       "Un equipo de educadores de WeCode visita el colegio cada semana y dicta las clases.", "Creamos animaciones, videojuegos, apps, proyectos electrónicos y robots."]
        .map(t => '<li><img src="' + IMG + 'st/check.svg" alt="">' + t + "</li>").join("") +
      '</ul></div><div class="ph reveal" ' + bgStyle("classroom.jpg") + '><img src="' + IMG + 'st/code.svg" alt=""></div></div></section>'
      +
    '<section class="trust"><div class="wrap"><p class="lbl">Confían en WeCode<span class="count">' + SCHOOL_LOGOS.length + ' instituciones</span></p></div><div class="logos-rows" aria-label="Colegios que trabajan con WeCode">' + logoRow(SCHOOL_LOGOS.slice(0, half), "r1") + logoRow(SCHOOL_LOGOS.slice(half), "r2") + "</div></section>"
    ) : "") +

    '<section class="band glance" id="vistazo"><div class="wrap"><div class="head"><p class="eyebrow">' + esc(school) + ' de un vistazo</p><h2>' +
      nGr + (nGr === 1 ? " grado" : " grados") + ", " + M.rows.length + (M.rows.length === 1 ? " programa" : " programas") + " y un año de proyectos</h2></div>" +
      '<div class="track">' + grp("Primaria", "primaria") + grp("Secundaria", "secundaria") + "</div>" +
      '<div class="legend">' + M.mods.map(m => '<span><i style="background:' + (m === "curricular" ? "var(--blue)" : "var(--yellow)") + '"></i>' + MOD[m].label + "</span>").join("") +
        '<span><i style="background:var(--chip-off)"></i>No incluido</span><span style="color:var(--muted)">Tocá un grado para ver su programa</span></div>' +
      '<div class="prices">' + priceCards + "</div>" +
      '<p class="note">10 mensualidades, de marzo a diciembre · Todos los materiales incluidos</p></div></section>' +

    '<section class="band" id="programas"><div class="wrap"><p class="eyebrow">Propuesta pedagógica</p><h2>Qué van a aprender y crear</h2>' + progs + "</div></section>" +

    '<section class="band blue"><img class="doodle float" src="' + IMG + 'd-cloud2.png" style="right:6%;top:50px;width:130px" alt="">' +
      '<div class="wrap"><p class="eyebrow">Qué incluye</p><h2>Todo lo necesario para que funcione</h2><div class="tiles">' +
      tiles.map(t => '<div class="tile reveal"><img src="' + IMG + "st/" + t[0] + '.svg" alt=""><b>' + t[1] + "</b><span>" + t[2] + "</span></div>").join("") + "</div></div></section>" +

    '<section class="band pale"><div class="wrap"><p class="eyebrow">Feria de Proyectos</p><h2>Así cierran el año nuestros estudiantes</h2><p class="lead">Cada diciembre, los chicos presentan lo que crearon frente a sus familias y reciben sus medallas.</p></div>' +
      '<div class="marquee gallery" aria-label="Fotos de la Feria de Proyectos"><div class="marquee-track"><div class="marquee-set">' + gallery + '</div><div class="marquee-set" aria-hidden="true">' + gallery + "</div></div></div></section>" +

    '<section class="band" id="condiciones"><div class="wrap"><p class="eyebrow">Condiciones</p><h2>La letra chica, clara</h2><div class="acc">' + termCols + "</div>" +
      (annex ? '<div style="margin-top:56px"><p class="eyebrow">Anexo</p><h2>Alineación curricular</h2><p class="lead">Cómo el programa de WeCode cumple con los requerimientos de ANEP y DGES para los grados de esta propuesta.</p><div class="acc">' + annex + "</div></div>" : "") +
    "</div></section>" +

    '<section class="band blue close" id="contacto">' +
      '<img class="doodle spin" src="' + IMG + 'd-star1.png" style="left:4%;top:40px;width:40px" alt="">' +
      '<img class="doodle float" src="' + IMG + 'd-cloud1.png" style="left:46%;top:30px;width:130px" alt="">' +
      '<div class="wrap"><div><h2>¿Nos tomamos un café?</h2><p class="lead">Si la propuesta te parece interesante, nos encantaría reunirnos y conversar los detalles. Podemos intercambiar ideas y crear la experiencia que mejor se adapte a ' + esc(school) + ".</p>" +
      '<div class="contact"><b>' + esc(st.cName || "Equipo WeCode") + '</b><span class="role">' + esc(st.cRole || "") + '</span><div class="lines">' +
        (st.cEmail ? "<span>" + esc(st.cEmail) + "</span>" : "") + (st.cPhone ? "<span>" + esc(st.cPhone) + "</span>" : "") + "</div>" +
        '<div class="btns">' + (wa ? '<a class="btn y" href="' + wa + '" target="_blank" rel="noopener">Escribir por WhatsApp</a>' : "") +
        (st.cEmail ? '<button type="button" class="btn o" id="copyMail">Copiar email</button>' : "") + "</div></div></div>" +
      '<div class="ph" ' + bgStyle("certificates.jpg") + '><img src="' + IMG + 'st/heart.svg" alt=""></div></div></section>' +
    '<footer class="foot"><div class="wrap"><span>info@wecode.edu.uy</span><span>093 780 720</span><a href="https://www.wecode.edu.uy" target="_blank" rel="noopener">wecode.edu.uy</a></div></footer>';

  // Grados → programa
  document.querySelectorAll("button.chip[data-row]").forEach(b => b.addEventListener("click", () => {
    const el = document.getElementById("prog-" + b.dataset.row);
    if (!el) return;
    el.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "center" });
    el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
  }));
  // Copiar email
  const cm = document.getElementById("copyMail");
  if (cm) cm.addEventListener("click", () => {
    const done = () => { cm.textContent = "Email copiado"; setTimeout(() => (cm.textContent = "Copiar email"), 2200); };
    const fallback = () => { const r = document.createRange(); const n = document.querySelector(".contact .lines span"); if (n) { r.selectNodeContents(n); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } cm.textContent = "Seleccionado: copialo"; };
    try { navigator.clipboard.writeText(st.cEmail).then(done, fallback); } catch (e) { fallback(); }
  });
  // Precios: cuentan hacia arriba al aparecer (el valor final ya está escrito)
  if (window.IntersectionObserver && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
    const io = new IntersectionObserver(entries => entries.forEach(en => {
      if (!en.isIntersecting) return;
      io.unobserve(en.target);
      const el = en.target, end = Number(el.dataset.count) || 0, t0 = performance.now(), dur = 1100;
      const step = t => { const k = Math.min(1, (t - t0) / dur); el.textContent = money(Math.round(end * (1 - Math.pow(1 - k, 3)))); if (k < 1) requestAnimationFrame(step); };
      requestAnimationFrame(step);
    }), { threshold: .6 });
    document.querySelectorAll(".num[data-count]").forEach(n => io.observe(n));
  }
}

function renderEmpty(msg, detail) {
  document.title = "Propuesta WeCode";
  document.getElementById("app").innerHTML = '<div class="empty"><img src="' + IMG + 'logo-white.png" alt="WeCode"><h1>' + esc(msg) + "</h1><p>Pedile a tu contacto de WeCode que te reenvíe el link completo, o escribinos a info@wecode.edu.uy.</p>" +
    (detail ? '<p style="font-size:13px;opacity:.6">' + esc(detail) + "</p>" : "") + "</div>";
}

async function load() {
  const token = decodeURIComponent((location.hash || "").slice(1)).trim().toLowerCase();
  if (!token) { renderEmpty("Este link no tiene una propuesta"); return; }
  try {
    const st = await decodeProposal(token);
    if (!modelFor(st).sel.length) throw new Error("vacía");
    render(st);
    window.scrollTo(0, 0);
  } catch (e) {
    console.error(e);
    renderEmpty("No pudimos abrir esta propuesta", "Código recibido: " + token.length + " caracteres (" + (e && e.message || "error") + ")");
  }
}
window.addEventListener("hashchange", load);
load();
</script>
